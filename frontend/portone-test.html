<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortOne V2 Test</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #111827;
        }

        main {
            max-width: 720px;
            margin: 40px auto;
            padding: 32px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(17, 24, 39, 0.08);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0 0 24px;
            line-height: 1.5;
            color: #4b5563;
        }

        form {
            display: grid;
            gap: 16px;
        }

        label {
            display: grid;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input, select, button {
            font: inherit;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #fff;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 14px 18px;
            font-weight: 700;
            cursor: pointer;
            background: #111827;
            color: #fff;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        pre {
            margin: 24px 0 0;
            padding: 16px;
            border-radius: 12px;
            background: #0f172a;
            color: #e2e8f0;
            overflow: auto;
            min-height: 160px;
        }
    </style>
</head>
<body>
<main>
    <h1>PortOne V2 테스트 결제</h1>
    <p>백엔드에서 받은 <code>paymentId</code>로 결제창을 열고, 응답의 <code>txId</code>를 포스트맨 <code>/payments/confirm</code>에 넣으면 됩니다.</p>

    <form id="payment-form">
        <label>
            Store ID
            <input id="store-id" placeholder="store-xxxx" required>
        </label>

        <label>
            Channel Key
            <input id="channel-key" placeholder="channel-key-xxxx" required>
        </label>

        <label>
            Payment ID
            <input id="payment-id" value="ORDER-1" required>
        </label>

        <label>
            Order Name
            <input id="order-name" value="테스트 주문" required>
        </label>

        <label>
            Buyer Email
            <input id="buyer-email" type="email" value="test@example.com" required>
        </label>

        <label>
            Buyer Name
            <input id="buyer-name" value="테스트구매자" required>
        </label>

        <label>
            Buyer Phone
            <input id="buyer-phone" value="01012345678" required>
        </label>

        <label>
            Amount
            <input id="amount" type="number" min="1" value="1000" required>
        </label>

        <label>
            Pay Method
            <select id="pay-method">
                <option value="CARD" selected>CARD</option>
            </select>
        </label>

        <button id="submit-button" type="submit">결제창 열기</button>
    </form>

    <pre id="result">여기에 결제 응답이 표시됩니다.</pre>
</main>

<script type="module">
    import * as PortOne from "https://cdn.portone.io/v2/browser-sdk.esm.js";

    const form = document.getElementById("payment-form");
    const submitButton = document.getElementById("submit-button");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        result.textContent = "결제창 호출 중...";

        const request = {
            storeId: document.getElementById("store-id").value.trim(),
            channelKey: document.getElementById("channel-key").value.trim(),
            paymentId: document.getElementById("payment-id").value.trim(),
            orderName: document.getElementById("order-name").value.trim(),
            customer: {
                email: document.getElementById("buyer-email").value.trim(),
                fullName: document.getElementById("buyer-name").value.trim(),
                phoneNumber: document.getElementById("buyer-phone").value.trim(),
            },
            totalAmount: Number(document.getElementById("amount").value),
            currency: "CURRENCY_KRW",
            payMethod: document.getElementById("pay-method").value,
        };

        try {
            const response = await PortOne.requestPayment(request);
            result.textContent = JSON.stringify(response, null, 2);
        } catch (error) {
            result.textContent = JSON.stringify({
                message: error instanceof Error ? error.message : "결제창 호출 실패",
                error,
            }, null, 2);
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
